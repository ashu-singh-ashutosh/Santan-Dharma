<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>सनातन धर्म — The Eternal Path</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Devanagari:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --saffron: #ff6b00;
        --gold: #ffd700;
        --deep-gold: #c9a227;
        --cosmic: #0a0015;
        --cosmic-mid: #1a0030;
        --lotus: #e8457a;
        --cream: #fff8e7;
        --sacred-red: #8b0000;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--cosmic);
        color: var(--cream);
        /* overflow-x: hidden; */
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--cosmic);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--saffron);
        border-radius: 3px;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @keyframes rotate-slow {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes rotate-reverse {
        from {
          transform: rotate(360deg);
        }
        to {
          transform: rotate(0);
        }
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 20px #ff6b0044;
        }
        50% {
          box-shadow:
            0 0 60px #ff6b00aa,
            0 0 100px #ffd70055;
        }
      }
      @keyframes smoke {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0.6;
        }
        100% {
          transform: translateY(-120px) scale(2);
          opacity: 0;
        }
      }
      @keyframes shimmer {
        0% {
          background-position: -200% center;
        }
        100% {
          background-position: 200% center;
        }
      }
      .font-cinzel {
        font-family: Cinzel, serif;
      }
      .font-cinzel-dec {
        font-family: "Cinzel Decorative", serif;
      }
      .font-devanagari {
        font-family: "Noto Sans Devanagari", sans-serif;
      }
      .text-gradient {
        background: linear-gradient(135deg, #ff6b00, gold, #ff6b00);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s linear infinite;
      }
      .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 215, 0, 0.15);
      }
      .glow-card {
        transition: all 0.4s ease;
      }
      .glow-card:hover {
        box-shadow:
          0 0 40px rgba(255, 107, 0, 0.4),
          0 0 80px rgba(255, 215, 0, 0.15);
        transform: translateY(-6px);
      }
      .temple-card {
        border: 1px solid rgba(255, 215, 0, 0.2);
        transition: all 0.3s ease;
      }
      .temple-card:hover {
        border-color: rgba(255, 107, 0, 0.8);
      }
      .nav-link {
        position: relative;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--saffron);
        transition: width 0.3s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .om-symbol {
        text-shadow:
          0 0 30px gold,
          0 0 60px #ff6b00;
      }
    </style>
  </head>
